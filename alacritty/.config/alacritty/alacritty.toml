
[window]
opacity = 0.95

[font]
size = 10

[font.bold]
family = "MesloLGS NF"
style = "Bold"

[font.bold_italic]
family = "MesloLGS NF"
style = "Bold Italic"

[font.italic]
family = "MesloLGS NF"
style = "Italic"

[font.normal]
family = "MesloLGS NF"
style = "Regular"

[general]
import = ["~/.config/alacritty/catppuccin-frappe.toml"]

[terminal]
shell = "fish"

[bell]
animation = "EaseOutExpo"
duration = 150
color = "#ffffff"
command = { program = "paplay", args = ["/usr/share/sounds/freedesktop/stereo/bell.oga"] }
